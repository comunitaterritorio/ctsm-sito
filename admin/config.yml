backend:
  name: git-gateway
  branch: main

media_folder: "comunicati"
public_folder: "/comunicati"

publish_mode: simple

collections:
  - name: "comunicati"
    label: "Archivio Comunicati"
    files:
      - file: "data/comunicati.json"
        label: "Comunicati"
        name: "comunicati"
        fields:
          - label: "Comunicati"
            name: "items"
            widget: "list"
            add_to_top: true
            label_singular: "Comunicato"
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Data (es. 3 Settembre 2026)", name: "date", widget: "string" }
              - { label: "File PDF (puoi sceglierne piu' di uno in una volta)", name: "file", widget: "multi-upload", accept: "application/pdf", media_folder: "/comunicati", public_folder: "/comunicati" }
              - { label: "Descrizione breve (per WhatsApp/social, facoltativa)", name: "excerpt", widget: "text", required: false, hint: "1-2 frasi: e' il testo che appare nell'anteprima quando il link viene condiviso su WhatsApp/Facebook." }
              - { label: "Immagini (facoltative) - puoi sceglierne quante vuoi in una volta", name: "image", widget: "multi-upload", accept: "image/*", media_folder: "/comunicati", public_folder: "/comunicati", required: false, hint: "La prima immagine e' l'anteprima per WhatsApp/social; le altre compaiono in galleria nella pagina del comunicato. Se vuoto, viene usata l'immagine generica del sito." }

  - name: "eventi"
    label: "Prossimi Eventi"
    files:
      - file: "data/eventi.json"
        label: "Prossimi Eventi"
        name: "eventi"
        media_folder: "/eventi"
        public_folder: "/eventi"
        fields:
          - label: "Eventi"
            name: "items"
            widget: "list"
            add_to_top: true
            label_singular: "Evento"
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Data", name: "date", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD", picker_utc: false }
              - { label: "Orario (es. ore 18:30)", name: "time", widget: "string" }
              - { label: "Luogo", name: "location", widget: "string" }
              - { label: "Categoria (es. Assemblea, Incontro)", name: "category", widget: "string", required: false }
              - { label: "Descrizione", name: "description", widget: "text" }
              - { label: "Locandina / immagini (facoltative) - puoi sceglierne piu' di una", name: "image", widget: "multi-upload", accept: "image/*", media_folder: "/eventi", public_folder: "/eventi", required: false, hint: "La prima immagine appare in cima alla card dell'evento sul sito, le altre come miniature sotto." }

  - name: "eventi-archivio"
    label: "Archivio Eventi"
    files:
      - file: "data/eventi-archivio.json"
        label: "Archivio Eventi"
        name: "eventi-archivio"
        media_folder: "/eventi"
        public_folder: "/eventi"
        fields:
          - label: "Eventi"
            name: "items"
            widget: "list"
            add_to_top: true
            label_singular: "Evento"
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "Titolo evento", name: "title", widget: "string" }
              - { label: "Data (es. 20 Settembre 2026)", name: "date", widget: "string" }
              - { label: "Descrizione (facoltativa)", name: "description", widget: "text", required: false }
              - { label: "Immagini (facoltative) - puoi sceglierne quante vuoi in una volta", name: "images", widget: "multi-upload", accept: "image/*", media_folder: "/eventi", public_folder: "/eventi", required: false }
              - { label: "File PDF (facoltativi) - puoi sceglierne piu' di uno", name: "pdf", widget: "multi-upload", accept: "application/pdf", media_folder: "/eventi", public_folder: "/eventi", required: false }

  - name: "incontri"
    label: "I Nostri Incontri"
    files:
      - file: "data/incontri.json"
        label: "Incontri"
        name: "incontri"
        media_folder: "/incontri"
        public_folder: "/incontri"
        fields:
          - label: "Incontri"
            name: "items"
            widget: "list"
            add_to_top: true
            label_singular: "Incontro"
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "Nome evento", name: "title", widget: "string" }
              - { label: "Data (es. 20 Settembre 2026)", name: "date", widget: "string" }
              - { label: "Immagini della serata - puoi sceglierne quante vuoi in una volta", name: "images", widget: "multi-upload", accept: "image/*", media_folder: "/incontri", public_folder: "/incontri", required: false }
              - { label: "PDF resoconto della serata - puoi sceglierne piu' di uno", name: "pdf", widget: "multi-upload", accept: "application/pdf", media_folder: "/incontri", public_folder: "/incontri", required: false }

  - name: "istanze"
    label: "Istanze d'Arengo"
    files:
      - file: "data/istanze.json"
        label: "Istanze"
        name: "istanze"
        media_folder: "/istanze"
        public_folder: "/istanze"
        fields:
          - label: "Istanze"
            name: "items"
            widget: "list"
            add_to_top: true
            label_singular: "Istanza"
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Data (es. 4 Settembre 2026)", name: "date", widget: "string" }
              - { label: "File PDF (puoi sceglierne piu' di uno in una volta)", name: "file", widget: "multi-upload", accept: "application/pdf", media_folder: "/istanze", public_folder: "/istanze" }

  - name: "post-evidenza"
    label: "Post in Evidenza (Social)"
    files:
      - file: "data/post-in-evidenza.json"
        label: "Post in evidenza"
        name: "post-evidenza"
        media_folder: "/post-evidenza"
        public_folder: "/post-evidenza"
        fields:
          - label: "Post"
            name: "items"
            widget: "list"
            add_to_top: true
            label_singular: "Post"
            summary: "{{date}} — {{text}}"
            fields:
              - { label: "Testo del post", name: "text", widget: "text" }
              - { label: "Data (es. 11 Settembre 2026)", name: "date", widget: "string" }
              - { label: "Immagini (facoltative) - puoi sceglierne piu' di una", name: "image", widget: "multi-upload", accept: "image/*", media_folder: "/post-evidenza", public_folder: "/post-evidenza", required: false }
              - { label: "Link al post Facebook (facoltativo)", name: "link", widget: "string", required: false }
